# EINMALIG: holt den Verkora-Signierschluessel aus dem GitHub-Secret als Entwurfs-Release (zaehlt nicht gegen den Artefakt-Speicher).
# Laeuft nur, wenn das Repo privat ist. Nach dem Herunterladen: Entwurf loeschen, Lauf loeschen, diese Datei loeschen.
name: Schluessel sichern (einmalig)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - name: Nur in privatem Repo
        if: github.event.repository.private != true
        run: |
          echo "::error::Repo ist oeffentlich. Erst auf privat stellen, dann erneut starten."
          exit 1

      - name: Keystore aus Secret wiederherstellen und pruefen
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          # Sollwert aus docs/Veroeffentlichung.md (CN=Inserat-Helfer, Alias inserathelfer)
          SOLL_SHA256: "7C:71:71:FC:A3:38:12:F5:CF:36:FB:63:48:86:05:32:CB:99:26:7F:16:3C:F2:36:3E:F4:A2:3B:8C:A6:EE:EC"
        run: |
          test -n "$KEYSTORE_B64"     || { echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "::error::Secret SIGNING_PASSWORD fehlt"; exit 1; }
          mkdir -p sicherung
          echo "$KEYSTORE_B64" | base64 -d > sicherung/verkora-release.jks
          keytool -list -v -keystore sicherung/verkora-release.jks -storepass "$SIGNING_PASSWORD" > info.txt
          grep -E "^(Alias|Aliasname|Alias name)|SHA256:|Owner:|Eigent" info.txt || true
          ist=$(grep -m1 "SHA256:" info.txt | awk '{print $NF}')
          if [ "$ist" != "$SOLL_SHA256" ]; then
            echo "::error::Fingerabdruck passt nicht: $ist (erwartet $SOLL_SHA256)"; exit 1
          fi
          echo "Fingerabdruck OK - das ist der Verkora-Schluessel."

      - name: Als Entwurfs-Release ablegen (nur fuer dich sichtbar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create schluessel-sicherung sicherung/verkora-release.jks \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Schluessel-Sicherung - nach Download sofort loeschen" \
            --notes "verkora-release.jks herunterladen, nach HiDrive\\Sync\\Schluessel\\verkora legen, dann diesen Entwurf loeschen."

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Secret SIGNING_KEYSTORE_BASE64: APK wird mit wechselndem Debug-Schlüssel signiert und lässt sich nicht drüber installieren."
          fi
      - name: Tests und Debug-APK bauen
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:assembleStoreDebug
      - uses: actions/upload-artifact@v7
        with:
          name: verkora-${{ github.run_number }}-apk
          path: app/build/outputs/apk/store/debug/*.apk
      # Probelauf fuer die Intune-Version (ohne Upload): zeigt frueh, ob Release-Build und Signatur passen.
      - name: Intune-Release-APK probeweise bauen
        if: env.SIGNING_KEYSTORE_PATH != ''
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          # eBay-Anbindung (nicht geheim, GitHub-Variablen; wirkt, sobald die eBay-Funktion gemergt ist)
          EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID }}
          EBAY_RUNAME: ${{ vars.EBAY_RUNAME }}
          EBAY_TOKEN_SERVICE_URL: ${{ vars.EBAY_TOKEN_SERVICE_URL }}
          EBAY_SANDBOX: ${{ vars.EBAY_SANDBOX }}
        run: |
          ./gradlew --no-daemon :app:assembleInternRelease
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs app/build/outputs/apk/intern/release/app-intern-release.apk | grep 'SHA-256'
          "$bt/aapt2" dump badging app/build/outputs/apk/intern/release/app-intern-release.apk | head -1
      - uses: actions/upload-artifact@v7
        if: env.SIGNING_KEYSTORE_PATH != ''
        with:
          name: verkora-intern-release-${{ github.run_number }}
          path: app/build/outputs/apk/intern/release/app-intern-release.apk

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests und Debug-APK bauen
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: inserat-helfer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
